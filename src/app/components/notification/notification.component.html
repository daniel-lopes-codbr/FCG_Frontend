<!-- Notification Container -->
<div class="fixed top-4 right-4 z-50 space-y-3 max-w-sm w-full">
  <!-- Individual Notification -->
  <div
    *ngFor="let notification of notifications; trackBy: trackByNotificationId"
    class="notification-item transform transition-all duration-300 ease-in-out"
    [class]="getNotificationClass(notification.type)"
    [@slideInOut]
  >
    <div class="flex items-start p-4 rounded-lg border shadow-lg">
      <!-- Icon -->
      <div class="flex-shrink-0 mr-3">
        <i [class]="getIconClass(notification.type) + ' ' + getIconColorClass(notification.type)"></i>
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0">
        <h4 class="text-sm font-semibold mb-1">
          {{ notification.title }}
        </h4>
        <p class="text-sm opacity-90">
          {{ notification.message }}
        </p>
      </div>

      <!-- Close Button -->
      <div class="flex-shrink-0 ml-3">
        <button
          (click)="dismiss(notification)"
          class="inline-flex items-center justify-center w-6 h-6 rounded-full hover:bg-black hover:bg-opacity-10 transition-colors duration-200"
          aria-label="Dismiss notification"
        >
          <i class="fas fa-times text-xs"></i>
        </button>
      </div>
    </div>
  </div>
</div>
