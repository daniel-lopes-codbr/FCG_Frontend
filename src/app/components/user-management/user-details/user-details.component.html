<div class="space-y-6">
  <!-- Header -->
  <div class="flex justify-between items-center">
    <h3 class="text-xl font-semibold text-gray-900 dark:text-gray-100">User Details</h3>
    <button
      (click)="onClose()"
      class="btn-secondary flex items-center space-x-2"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
      <span>Close</span>
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="card p-8 text-center">
    <div class="flex justify-center">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600"></div>
    </div>
    <p class="mt-4 text-gray-600 dark:text-gray-400">Loading user details...</p>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg class="h-5 w-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div class="ml-3">
        <h3 class="text-sm font-medium text-red-800 dark:text-red-200">
          Error
        </h3>
        <div class="mt-2 text-sm text-red-700 dark:text-red-300">
          {{ errorMessage }}
        </div>
      </div>
    </div>
  </div>

  <!-- User Details -->
  <div *ngIf="!loading && user" class="space-y-6">
    <!-- User Profile Card -->
    <div class="card p-6">
      <div class="flex items-center space-x-4">
        <!-- Avatar -->
        <div class="flex-shrink-0">
          <div class="w-20 h-20 bg-gradient-to-br from-primary-500 to-purple-600 rounded-full flex items-center justify-center">
            <span class="text-white text-2xl font-bold">
              {{ getInitialLetter() }}
            </span>
          </div>
        </div>

        <!-- User Info -->
        <div class="flex-1 min-w-0">
          <h3 class="text-2xl font-medium text-gray-900 dark:text-gray-100">
            {{ user.name }}
          </h3>
          <p class="text-lg text-gray-500 dark:text-gray-400">
            {{ user.email }}
          </p>
          <div class="mt-2">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium {{ getPermissionBadgeClass(user.permission) }}">
              {{ user.permission }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- User Information Details -->
    <div class="card p-6">
      <h4 class="text-lg font-medium text-gray-900 dark:text-gray-100 mb-4">User Information</h4>
      <dl class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-2">
        <div>
          <dt class="text-sm font-medium text-gray-500 dark:text-gray-400">User ID</dt>
          <dd class="mt-1 text-sm text-gray-900 dark:text-gray-100 font-mono">{{ user.id }}</dd>
        </div>
        <div>
          <dt class="text-sm font-medium text-gray-500 dark:text-gray-400">Full Name</dt>
          <dd class="mt-1 text-sm text-gray-900 dark:text-gray-100">{{ user.name }}</dd>
        </div>
        <div>
          <dt class="text-sm font-medium text-gray-500 dark:text-gray-400">Email Address</dt>
          <dd class="mt-1 text-sm text-gray-900 dark:text-gray-100">{{ user.email }}</dd>
        </div>
        <div>
          <dt class="text-sm font-medium text-gray-500 dark:text-gray-400">Permission Level</dt>
          <dd class="mt-1">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium {{ getPermissionBadgeClass(user.permission) }}">
              {{ user.permission }}
            </span>
          </dd>
        </div>
      </dl>
    </div>

    <!-- Actions -->
    <div class="card p-6">
      <h4 class="text-lg font-medium text-gray-900 dark:text-gray-100 mb-4">Actions</h4>
      <div class="flex space-x-4">
        <button
          (click)="onEdit()"
          class="btn-primary flex items-center space-x-2"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          <span>Edit User</span>
        </button>
        <button
          (click)="onDelete()"
          class="btn-danger flex items-center space-x-2"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>Delete User</span>
        </button>
      </div>
    </div>
  </div>
</div>
